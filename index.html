<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiyu · Pedidos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1E293B;color:#1E3A8A;font:16px system-ui,sans-serif}
header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:32px}h2{font-size:22px}button,input,select{font:inherit}button{padding:11px 18px;border:1px solid #2563EB;border-radius:7px;background:#2563EB;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.secondary{background:white;color:#2563EB}input,select{width:100%;padding:11px;border:1px solid #94A3BB;border-radius:6px;background:white;color:#1E3A8A}
label{display:block;margin:12px 0}label span{display:block;margin-bottom:6px}input[type=checkbox]{width:auto}
section,article{background:white;border:1px solid #94A3BB;border-radius:10px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
nav{display:flex;gap:10px;margin-bottom:22px}#message{white-space:pre-wrap;padding:0 24px;max-width:1100px;margin:0 auto;color:#1E3A8A}
#suggestions button{display:block;width:100%;text-align:left;margin-bottom:4px}output{display:block;font-weight:bold;margin:16px 0}
small{color:#475569}.date{font-weight:bold;font-size:21px}.badge{color:#1E3A8A}fieldset{border:0;padding:0;margin:0;min-width:0}[hidden]{display:none!important}

body:has(#queueSection:not([hidden])) main{max-width:1800px}
#queue{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;overflow-x:auto;align-items:start;padding-bottom:16px}
#queue.with-delivered{grid-template-columns:repeat(5,minmax(260px,1fr))}
.stage-column{min-width:0;border-top:4px solid var(--stage-color);background:#eef2f8;border-radius:8px;padding:12px}
.stage-column h3.stage-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-size:18px}
.stage-count{background:white;border-radius:20px;padding:3px 10px;font-size:14px}
.stage-column article{padding:16px;margin:0 0 12px;overflow-wrap:anywhere}
.stage-column article h3{font-size:16px;margin-top:0}
.stage-column article .date{font-size:18px}
.stage-column article button{width:100%;margin-top:10px}
.stage-column article form{margin-top:14px}
.stage-empty{color:#475569;font-size:14px}

header{background:white;border-bottom:4px solid #10B981;border-radius:0 0 12px 12px}
nav{flex-wrap:wrap}nav .secondary{background:white}
#message{color:#ffffff}#message:empty{display:none}
small,.stage-column article small{color:#475569}
button:hover{background:#1E3A8A;color:white}
input:focus,select:focus,button:focus-visible{outline:3px solid #10B981;outline-offset:2px}
input[type=checkbox]{accent-color:#2563EB}
.stage-count{color:#475569}.stage-column article{border-color:#94A3BB}
#total{color:#1E3A8A}
</style>
</head>
<body>
<header><div><h1>taiyu</h1><small>Gestión de pedidos</small></div><button id="logout" class="secondary" hidden>Salir</button></header>
<p id="message" role="status"></p>
<main>
<section id="access">
<h2>Ingresar</h2>
<form id="login">
<label><span>Correo de tu cuenta de Taiyu</span><input name="email" type="email" autocomplete="username" required></label>
<label><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label>
<button>Ingresar</button>
</form>
</section>
<div id="workspace" hidden>
<nav><button id="showNew">Nuevo pedido</button><button id="showQueue" class="secondary">Cola de trabajo</button><button id="showCatalog" class="secondary">Catálogo</button></nav><section id="catalogPanel" hidden><h2>Agregar producto</h2><p id="catalogMessage" role="status"></p><form id="productForm"><label><span>Categoría</span><select id="categorySelect" required></select></label><label><span>Producto</span><input id="productName" required></label><label><span>Precio unitario ₡</span><input id="productPrice" type="number" min="0" step=".01" required></label><button>Guardar producto</button></form><form id="categoryForm" hidden><h3>Nueva categoría</h3><label><span>Nombre</span><input id="categoryName" required></label><label><span>Dentro de</span><select id="categoryParent"></select></label><button>Guardar categoría</button><button type="button" id="cancelCategory" class="secondary">Cancelar</button></form></section>
<section id="newOrder">
<h2>Nuevo pedido</h2>
<form id="order">
<fieldset id="fields">
<div class="grid">
<label><span>Cliente</span><input id="customer" autocomplete="off" required><div id="suggestions"></div></label>
<label><span>Teléfono</span><input id="phone" type="tel" required></label>
</div>
<div id="lines"></div>
<button type="button" id="add" class="secondary">Agregar producto</button>
<output id="total">Total ₡0</output>
<label><input id="deposit" type="checkbox"> Solicitar adelanto</label>
<label id="amountLabel" hidden><span>Adelanto acordado ₡</span><input id="amount" type="number" min="0" step=".01"></label>
<button id="save">Agregar pedido</button>
</fieldset>
</form>
<button id="retry" hidden>Reintentar pedido pendiente</button>
</section>
<section id="queueSection" hidden>
<h2>Cola de trabajo</h2><button id="refresh" class="secondary">Actualizar</button>
<label><input id="showDelivered" type="checkbox"> Mostrar entregadas</label><p id="queueStatus"></p><div id="queue" class="cards"></div>
</section>
</div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const db = createClient('https://rybfgojsiszrkuhgicpv.supabase.co', 'sb_publishable_ebG5ZqZjqmUinImTz5RiXw_zB3b685P');
const el = id => document.getElementById(id);
const money = value => new Intl.NumberFormat('es-CR', {style:'currency',currency:'CRC'}).format(value);
let catalog = [];
let clientId = null;
let searchVersion = 0;
let searchTimer;
let pendingKey;
let saving = false;
let manualDeposit = false;

function message(text) { el('message').textContent = text; }
async function rpc(name, args = {}) {
  const { data, error } = await db.rpc('taiyu_' + name, args);
  if (error) throw error;
  return data;
}
function calculate() {
  let total = 0;
  for (const row of el('lines').children) {
    const quantity = row.querySelector('[name=quantity]');
    const price = row.querySelector('[name=price]');
    const subtotal = Number(quantity.value) * Number(price.value);
    total += subtotal;
    row.querySelector('output').textContent = 'Subtotal ' + money(subtotal);
    const zero = [quantity, price].some(input => input.value !== '' && Number(input.value) === 0);
    row.querySelector('.reason').hidden = !zero;
    row.querySelector('[name=reason]').required = zero;
    const shipping = row.querySelector('[name=mode]').value === 'envio';
    row.querySelector('.address').hidden = !shipping;
    row.querySelector('[name=address]').required = shipping;
  }
  el('total').textContent = 'Total ' + money(total);
  el('amountLabel').hidden = !el('deposit').checked;
  el('amount').required = el('deposit').checked;
  el('amount').max = total;
  if (!manualDeposit) el('amount').value = (total * .4).toFixed(2);
}
function addLine() {
  const row = document.createElement('article');
  row.innerHTML = '<div class="grid"><label><span>Producto</span><select name="product" required></select></label><label><span>Cantidad</span><input name="quantity" type="number" min="0" step="1" value="1" required></label><label><span>Precio unitario ₡</span><input name="price" type="number" min="0" step=".01" required></label><label><span>Fecha de entrega</span><input name="date" type="date" required></label><label><span>Modalidad</span><select name="mode"><option value="retiro">Retiro</option><option value="envio">Envío</option></select></label></div><label class="address" hidden><span>Dirección</span><input name="address"></label><label><span>Especificaciones</span><input name="notes"></label><label class="reason" hidden><span>Motivo del valor cero · Administrador</span><input name="reason"></label><output></output><button type="button" class="secondary">Quitar producto</button>';
  const select = row.querySelector('select');
  select.add(new Option('Seleccionar producto', ''));
  for (const product of catalog) {
    select.add(new Option([...product.ruta_categoria, product.producto].join(' › '), product.producto_id));
  }
  select.onchange = () => {
    const product = catalog.find(item => String(item.producto_id) === select.value);
    row.querySelector('[name=price]').value = product?.precio_base ?? '';
    calculate();
  };
  row.querySelector('button').onclick = () => { row.remove(); calculate(); };
  el('lines').append(row);
  calculate();
}
function showQueue() {
  el('catalogPanel').hidden = true;
  el('newOrder').hidden = true;
  el('queueSection').hidden = false;
}
async function refreshQueue() {
  el('queueStatus').textContent = 'Cargando…';
  try {
    let rows;
    let enabled = true;
    try { rows = await rpc('seguimiento'); }
    catch (error) {
      if (error.code !== 'PGRST202') throw error;
      rows = await rpc('cola');
      enabled = false;
      message('Para habilitar las etapas ejecutá la migración 002 en Supabase.');
    }
    rows = rows.filter(row => el('showDelivered').checked || row.etapa !== 'Entregado');
    el('queue').replaceChildren();
    el('queue').classList.toggle('with-delivered', el('showDelivered').checked);
    const stages = [
      ['Ingreso', '#94A3BB'],
      ['Aprobación', '#1E3A8A'],
      ['Producción', '#2563EB'],
      ['Completado', '#475569'],
      ['Entregado', '#10B981']
    ].filter(([stage]) => el('showDelivered').checked || stage !== 'Entregado');
    const columns = new Map();
    for (const [stage, color] of stages) {
      const column = document.createElement('div');
      column.className = 'stage-column';
      column.style.setProperty('--stage-color', color);
      column.setAttribute('role', 'region');
      column.setAttribute('aria-label', stage);
      const heading = document.createElement('h3');
      heading.className = 'stage-heading';
      const count = rows.filter(row => row.etapa === stage).length;
      const badge = document.createElement('span');
      badge.className = 'stage-count';
      badge.textContent = count;
      heading.append(stage, badge);
      column.append(heading);
      if (!count) {
        const empty = document.createElement('p');
        empty.className = 'stage-empty';
        empty.textContent = 'Sin subórdenes';
        column.append(empty);
      }
      columns.set(stage, column);
      el('queue').append(column);
    }
    for (const row of rows) {
      const card = document.createElement('article');
      for (const [tag, text, className] of [
        ['h3',row.suborden,''],['p',row.cliente,''],['p','Entrega ' + row.fecha_entrega,'date'],
        ['p',row.cantidad + ' × ' + row.producto,''],['p',row.etapa,'badge'],
        ['p',money(row.subtotal),''],['small','En esta etapa desde ' + new Date(row.inicio_etapa).toLocaleString('es-CR'),'']
      ]) {
        const item = document.createElement(tag);
        item.textContent = text;
        item.className = className;
        card.append(item);
      }
      if (enabled) addActions(card, row);
      columns.get(row.etapa).append(card);
    }
    el('queueStatus').textContent = rows.length ? rows.length + ' subórdenes' : 'Sin pedidos pendientes.';
  } catch (error) {
    el('queueStatus').textContent = 'No se pudo actualizar la cola.';
    message(error.message);
  }
}

function addActions(card, row) {
  const progress = document.createElement('p');
  progress.textContent = 'Entregadas ' + row.entregadas + ' de ' + row.cantidad;
  card.append(progress);
  const form = document.createElement('form');
  let checkbox;
  let quantity;
  const next = {Ingreso:'Aprobación','Aprobación':'Producción','Producción':'Completado'};
  if (row.etapa === 'Aprobación') {
    const label = document.createElement('label');
    checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.required = true;
    label.append(checkbox, ' Confirmo la aprobación del cliente');
    form.append(label);
  }
  if (row.etapa === 'Completado') {
    const label = document.createElement('label');
    label.textContent = 'Unidades a entregar';
    quantity = document.createElement('input');
    quantity.type = 'number';
    quantity.min = 1;
    quantity.step = 1;
    quantity.max = row.cantidad - row.entregadas;
    quantity.value = quantity.max;
    quantity.required = true;
    label.append(quantity);
    form.append(label);
  }
  if (row.etapa !== 'Entregado') {
    const button = document.createElement('button');
    button.textContent = quantity ? 'Registrar entrega' : 'Pasar a ' + next[row.etapa];
    form.append(button);
    form.onsubmit = async event => {
      event.preventDefault();
      if (!confirm('¿Confirmar este movimiento para ' + row.suborden + '?')) return;
      button.disabled = true;
      try {
        await rpc('avanzar', {
          codigo:row.suborden,version_actual:row.version,
          siguiente:quantity ? 'Entrega' : next[row.etapa],
          aprobado:Boolean(checkbox && checkbox.checked),
          unidades:quantity ? Number(quantity.value) : 0
        });
        message('Movimiento registrado para ' + row.suborden);
        await refreshQueue();
      } catch (error) {
        message(error.message + ' Actualizá la cola antes de reintentar.');
        await refreshQueue();
      }
    };
    card.append(form);
  }
  const historyButton = document.createElement('button');
  historyButton.type = 'button';
  historyButton.className = 'secondary';
  historyButton.textContent = 'Ver historial';
  const history = document.createElement('div');
  historyButton.onclick = async () => {
    historyButton.disabled = true;
    try {
      const movements = await rpc('historial', {codigo:row.suborden});
      history.replaceChildren();
      for (const movement of movements) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = new Date(movement.fecha).toLocaleString('es-CR') + ' · ' + movement.nombre + ' · ' + movement.telefono + ' · ' + movement.accion;
        const values = document.createElement('pre');
        values.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px';
        values.textContent = JSON.stringify({anterior:movement.anterior,nuevo:movement.nuevo},null,2);
        details.append(summary,values);
        history.append(details);
      }
    } catch(error) { message(error.message); }
    finally { historyButton.disabled = false; }
  };
  card.append(historyButton,history);
}
el('showDelivered').onchange = refreshQueue;

function lockPending(locked) {
  el('fields').disabled = locked;
  el('retry').hidden = !locked;
}
async function sendPending() {
  if (saving) return;
  saving = true;
  el('retry').disabled = true;
  message('Guardando pedido…');
  try {
    const pending = JSON.parse(sessionStorage.getItem(pendingKey));
    const number = await rpc('guardar_pedido', pending);
    sessionStorage.removeItem(pendingKey);
    lockPending(false);
    el('order').reset();
    clientId = null;
    el('phone').readOnly = false;
    manualDeposit = false;
    searchVersion++;
    el('suggestions').replaceChildren();
    el('lines').replaceChildren();
    addLine();
    message('Pedido guardado: ' + number);
    showQueue();
    await refreshQueue();
  } catch (error) {
    // A confirmed database rejection permits correction. Network errors
    // retain the same request ID so retrying cannot duplicate the order.
    if (error.code && /^[0-9A-Z]{5}$/.test(error.code)) {
      sessionStorage.removeItem(pendingKey);
      lockPending(false);
    }
    message(error.message || 'Conexión interrumpida. Reintentá el pedido pendiente.');
  } finally {
    saving = false;
    el('retry').disabled = false;
  }
}
async function enter(session) {
  catalog = await loadCatalog();
  pendingKey = 'taiyu-pending-' + session.user.id;
  el('access').hidden = true;
  el('workspace').hidden = false;
  el('logout').hidden = false;
  el('lines').replaceChildren();
  addLine();
  lockPending(Boolean(sessionStorage.getItem(pendingKey)));
  if (sessionStorage.getItem(pendingKey)) message('Hay un pedido pendiente de confirmar. Reintentá para recuperar su resultado.');
  if (!catalog.length) message('El catálogo no tiene productos activos.');
}
el('login').onsubmit = async event => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  button.disabled = true;
  try {
    const values = new FormData(event.target);
    const {data,error} = await db.auth.signInWithPassword({email:values.get('email').trim(),password:values.get('password')});
    if (error) throw error;
    message('');
    await enter(data.session);
  } catch (error) { message(error.message); }
  finally { button.disabled = false; }
};
el('customer').oninput = () => {
  clientId = null;
  el('phone').readOnly = false;
  const version = ++searchVersion;
  clearTimeout(searchTimer);
  el('suggestions').replaceChildren();
  const text = el('customer').value.trim();
  if (!text) return;
  searchTimer = setTimeout(async () => {
    try {
      const customers = await rpc('buscar_clientes', {texto:text});
      if (version !== searchVersion) return;
      for (const customer of customers) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'secondary';
        button.textContent = customer.nombre + ' · ' + customer.telefono;
        button.onclick = () => {
          clientId = customer.id;
          el('customer').value = customer.nombre;
          el('phone').value = customer.telefono;
          el('phone').readOnly = true;
          el('suggestions').replaceChildren();
          searchVersion++;
        };
        el('suggestions').append(button);
      }
    } catch (error) { if (version === searchVersion) message(error.message); }
  }, 180);
};
el('order').onsubmit = event => {
  event.preventDefault();
  if (!el('lines').children.length) { message('Agregá al menos un producto.'); return; }
  const lines = Array.from(el('lines').children, row => {
    const value = name => row.querySelector('[name=' + name + ']').value;
    return {
      producto:Number(value('product')),cantidad:Number(value('quantity')),
      precio:Number(value('price')),fecha_entrega:value('date'),
      modalidad:value('mode'),direccion:value('address'),
      especificaciones:value('notes'),motivo_cero:value('reason')
    };
  });
  const pedido = {
    cliente_id:clientId,nombre_cliente:el('customer').value.trim(),
    telefono:el('phone').value,pedir_adelanto:el('deposit').checked,
    adelanto_acordado:el('deposit').checked ? Number(el('amount').value) : 0,
    lineas:lines
  };
  try {
    sessionStorage.setItem(pendingKey, JSON.stringify({solicitud:crypto.randomUUID(),pedido}));
    lockPending(true);
    sendPending();
  } catch (error) { message('No se pudo preparar el guardado: ' + error.message); }
};

async function loadCatalog() {
  try { return await rpc('catalogo_precios'); }
  catch(error) {
    if (error.code !== 'PGRST202') throw error;
    return rpc('catalogo');
  }
}
async function fillCategories(selected = '') {
  const categories = await rpc('categorias');
  el('categorySelect').replaceChildren(new Option('Seleccionar categoría',''));
  el('categoryParent').replaceChildren(new Option('Categoría principal',''));
  for (const category of categories) {
    const name = category.ruta.join(' › ');
    el('categorySelect').add(new Option(name,category.id));
    el('categoryParent').add(new Option(name,category.id));
  }
  el('categorySelect').add(new Option('+ Agregar categoría','add'));
  el('categorySelect').value = selected;
}
el('showCatalog').onclick = async () => {
  el('newOrder').hidden = true;
  el('queueSection').hidden = true;
  el('catalogPanel').hidden = false;
  el('catalogMessage').textContent = '';
  el('productForm').querySelector('button').disabled = true;
  try { await fillCategories(); el('productForm').querySelector('button').disabled = false; }
  catch(error) { el('catalogMessage').textContent = error.code === 'PGRST202' ? 'Primero ejecutá la migración 003 de catálogo en Supabase.' : error.message; }
};
el('categorySelect').onchange = () => {
  if (el('categorySelect').value === 'add') {
    el('categorySelect').value = '';
    el('categoryForm').hidden = false;
    el('productForm').hidden = true;
    el('categoryName').focus();
  }
};
el('cancelCategory').onclick = () => {
  el('categoryForm').hidden = true;
  el('productForm').hidden = false;
};
el('categoryForm').onsubmit = async event => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  button.disabled = true;
  try {
    const id = await rpc('crear_categoria',{nombre:el('categoryName').value.trim(),superior:el('categoryParent').value ? Number(el('categoryParent').value) : null});
    await fillCategories(String(id));
    el('categoryForm').reset();
    el('categoryForm').hidden = true;
    el('productForm').hidden = false;
    el('catalogMessage').textContent = 'Categoría disponible.';
  } catch(error) { el('catalogMessage').textContent = error.message; }
  finally { button.disabled = false; }
};
el('productForm').onsubmit = async event => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  button.disabled = true;
  try {
    await rpc('crear_producto',{categoria:Number(el('categorySelect').value),nombre:el('productName').value.trim(),precio:Number(el('productPrice').value)});
    el('catalogMessage').textContent = 'Producto guardado.';
    catalog = await loadCatalog();
    for (const row of el('lines').children) {
      const select = row.querySelector('[name=product]');
      const selected = select.value;
      select.replaceChildren(new Option('Seleccionar producto',''));
      for (const product of catalog) select.add(new Option([...product.ruta_categoria,product.producto].join(' › '),product.producto_id));
      select.value = selected;
    }
    el('productName').value = '';
    el('productPrice').value = '';
  } catch(error) { el('catalogMessage').textContent = error.message; }
  finally { button.disabled = false; }
};

el('add').onclick = addLine;
el('lines').oninput = calculate;
el('deposit').onchange = calculate;
el('amount').oninput = () => { manualDeposit = true; };
el('retry').onclick = sendPending;
el('refresh').onclick = refreshQueue;
el('showQueue').onclick = () => { showQueue(); refreshQueue(); };
el('showNew').onclick = () => { el('catalogPanel').hidden = true; el('newOrder').hidden = false; el('queueSection').hidden = true; };
el('logout').onclick = async () => {
  const {error} = await db.auth.signOut();
  if (error) message(error.message);
  else location.reload();
};
try {
  const {data,error} = await db.auth.getSession();
  if (error) throw error;
  if (data.session) await enter(data.session);
} catch (error) { message(error.message); }
</script>
</body>
</html>
